# fitnaai — Docker Compose
# Target: pve GamingPC (192.168.16.2) — CPU-only inference
#
# Production:
#   docker compose up -d
#   docker compose logs -f fitnaai
#
# Development (with hot-reload):
#   docker compose --profile dev up
#
# NOTE: Ollama runs CPU-only on this host (RX 6800 XT = AMD, no CUDA).
# GPU inference available when migrated to pve-ryzen (GTX 1080, Phase 9).

services:
  fitnaai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitnaai
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - FITNAAI_OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - fitnaai-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - fitnaai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G

  # Development override: mounts source for hot-reload
  fitnaai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitnaai-dev
    profiles: ["dev"]
    ports:
      - "8000:8000"
    environment:
      - FITNAAI_DEBUG=true
      - FITNAAI_OLLAMA_BASE_URL=http://ollama:11434
      - FITNAAI_OLLAMA_MODEL=llama3.2
    volumes:
      - ./src:/app/src
      - fitnaai-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - fitnaai-net
    command: ["uvicorn", "fitnaai.server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # NO GPU reservation — CPU-only on 192.168.16.2 (AMD RX 6800 XT, no CUDA)
    # When migrating to pve-ryzen (GTX 1080), uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fitnaai-net
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  fitnaai-data:
  ollama-models:

networks:
  fitnaai-net:
    driver: bridge
