# =============================================================================
# ai-host2.yml — AI stack for Host 2 (192.168.16.3, GTX 1080)
#
# Services:
#   - Ollama: Local LLM inference with NVIDIA GPU
#   - Qdrant: Vector database for agent memory
#   - JBOT API: OpenAI-compatible FastAPI gateway
#
# Prerequisites:
#   - Docker + Docker Compose installed
#   - NVIDIA Container Toolkit installed (nvidia-container-toolkit)
#   - nvidia-smi shows GTX 1080
#
# Usage:
#   docker compose -f docker/stacks/ai-host2.yml up -d
#   docker compose -f docker/stacks/ai-host2.yml logs -f ollama
#
# Test:
#   curl http://192.168.16.3:11434/api/tags        # Ollama models
#   curl http://192.168.16.3:6333/collections       # Qdrant collections
#   curl http://192.168.16.3:8000/health            # JBOT API health
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Ollama — Local LLM inference with GTX 1080 (8GB VRAM)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # GTX 1080 has 8GB VRAM — use quantized models
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Qdrant — Vector database for agent memory
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=false
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # JBOT API — OpenAI-compatible gateway
  # ---------------------------------------------------------------------------
  jbot-api:
    build:
      context: ../../
      dockerfile: jbot_api/Dockerfile
    container_name: jbot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_DEFAULT_MODEL=llama3.1:8b
      - QDRANT_COLLECTION=jbot_memory
      - QDRANT_VECTOR_SIZE=4096
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Mount FitnaAI data for agent context (read-only)
      - /mnt/data/fitnaai/home/fitna:/app/fitna:ro
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ollama-models:
    driver: local
  qdrant-data:
    driver: local
